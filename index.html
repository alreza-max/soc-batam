<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPI SOC Batam DC</title>
<meta name="theme-color" content="#E84A28">
<meta name="description" content="Dashboard KPI & Report Operational SOC Batam DC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SOC Batam">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--o:#EE4D2D;--o2:#F57A3D;--ink:#1F2430;--mut:#6B7280}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(120% 80% at 50% 0%,#FFF4EE 0%,#FFE3D6 55%,#FFD2BF 100%);
    display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
  .card{width:min(360px,100%);background:#fff;border-radius:24px;padding:32px 24px 26px;text-align:center;
    box-shadow:0 18px 50px rgba(232,74,40,.18),0 2px 6px rgba(0,0,0,.05)}
  .stage{position:relative;width:132px;height:112px;margin:0 auto 14px}
  .ring{position:absolute;inset:0 10px;margin:auto;width:112px;height:112px;border-radius:50%;
    border:5px solid #FFE1D6;border-top-color:var(--o);animation:spin 1s linear infinite}
  .box{position:absolute;left:50%;top:30px;width:46px;height:40px;margin-left:-23px;border-radius:7px;
    background:linear-gradient(160deg,var(--o2),var(--o));box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);
    animation:hop .7s ease-in-out infinite}
  .box:before{content:"";position:absolute;left:50%;top:0;width:10px;height:100%;margin-left:-5px;background:rgba(255,255,255,.55)}
  .belt{position:absolute;left:24px;right:24px;bottom:26px;height:8px;border-radius:4px;
    background:repeating-linear-gradient(90deg,#C9CED6 0 10px,#E5E7EB 10px 20px);background-size:20px 8px;animation:belt .5s linear infinite}
  h1{font-family:Fredoka,Nunito,sans-serif;font-weight:700;font-size:30px;letter-spacing:.3px}
  h1 .bang{display:inline-block;color:var(--o);animation:wig .9s ease-in-out infinite;transform-origin:50% 90%}
  p.sub{margin-top:6px;font-size:16px;font-weight:800;color:var(--mut)}
  p.sub b{color:var(--o)}
  .dots span{animation:blink 1.2s infinite both}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}.dots span:nth-child(4){animation-delay:.45s}
  .bar{margin:18px auto 0;height:6px;border-radius:3px;background:#FFE7DE;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,var(--o2),var(--o));animation:slide 1.3s ease-in-out infinite}
  .brand{margin-top:16px;font-size:12px;color:#9CA3AF;font-weight:700;letter-spacing:.4px}
  .err{display:none;margin-top:14px;font-size:14px;color:#B42318;font-weight:700}
  .btn{display:none;margin:14px auto 0;padding:11px 20px;border:0;border-radius:12px;background:var(--o);color:#fff;
    font:800 15px Nunito,sans-serif;text-decoration:none}
  body.offline .err,body.offline .btn,body.slow .btn{display:inline-block}
  body.offline .bar,body.offline .ring{opacity:.35;animation-play-state:paused}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  @keyframes belt{to{background-position:-20px 0}}
  @keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(14deg)}75%{transform:rotate(-14deg)}}
  @keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:1}}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="stage"><div class="ring"></div><div class="box"></div><div class="belt"></div></div>
    <h1>Tolong sabar <span class="bang">!</span></h1>
    <p class="sub">Sedang Loading <b>Bujang</b><span class="dots"><span>.</span><span>.</span><span>.</span><span>.</span></span></p>
    <div class="bar"><i></i></div>
    <div class="err" id="err">Tidak ada koneksi internet. Sambungkan dulu, lalu coba lagi.</div>
    <a class="btn" id="go" href="https://script.google.com/a/macros/spxexpress.com/s/AKfycbzqAOV5_nh8kAairKzTFTCdkMSyLY3UAatVZtBcl9zPQZB0HAbYjsXK4Mw7JSz2XKbiOw/exec">Buka Dashboard</a>
    <div class="brand">KPI SOC BATAM DC</div>
  </main>
<script>
  var DASH = "https://script.google.com/a/macros/spxexpress.com/s/AKfycbzqAOV5_nh8kAairKzTFTCdkMSyLY3UAatVZtBcl9zPQZB0HAbYjsXK4Mw7JSz2XKbiOw/exec";
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
  function launch(){
    if (!navigator.onLine) { document.body.classList.add('offline'); return; }
    document.body.classList.remove('offline');
    setTimeout(function(){ document.body.classList.add('slow'); }, 8000);
    setTimeout(function(){ location.replace(DASH); }, 600);
  }
  document.getElementById('go').addEventListener('click', function(e){
    if (!navigator.onLine) { e.preventDefault(); }
  });
  window.addEventListener('online', launch);
  window.addEventListener('pageshow', function(e){ if (e.persisted) launch(); });
  launch();
</script>
</body>
</html>
