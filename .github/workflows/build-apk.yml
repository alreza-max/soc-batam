name: Build APK SOC Batam
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buat ikon launcher
        run: |
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow
          python tools/mkicon_android.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Buat keystore (sekali pakai, tidak disimpan)
        run: |
          KS_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$KS_PASS"
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias socbatam -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=SOC Batam, O=SOC Batam, C=ID"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KS_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SOC-Batam-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Terbitkan APK ke GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages --depth=1
          git worktree add ../site gh-pages
          mkdir -p ../site/download
          cp app/build/outputs/apk/release/app-release.apk ../site/download/SOC-Batam.apk
          cd ../site
          git add download/SOC-Batam.apk
          git diff --cached --quiet || git commit -m "Terbitkan APK SOC Batam"
          git push origin gh-pages
